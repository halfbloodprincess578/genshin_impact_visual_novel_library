// ============ ДВИЖОК ============
const textBox = document.getElementById('text-box');
const choicesEl = document.getElementById('choices');
const continueBtn = document.getElementById('continue');
const visualEl = document.getElementById('visual');
const portraitEl = document.getElementById('portrait');
const sceneLabel = document.getElementById('scene-label');
const progressBar = document.getElementById('progress-bar');

let currentScene = null;
let currentStep = 0;
let currentStepData = null;

function showScene(id) {
  currentScene = SCENES[id];
  if (!currentScene) {
    console.error('Сцена не найдена:', id);
    return;
  }
  currentStep = 0;

  // обновляем заголовок
  sceneLabel.textContent = currentScene.label;

  // прогресс
  const totalScenes = 7;
  let num = 1;
  const sid = String(id);
  if (sid === '1a' || sid === '1b' || sid === '1c') num = 1;
  else if (sid === '3a' || sid === '3b' || sid === '3c') num = 3;
  else num = parseInt(sid) || 1;
  progressBar.style.width = ((num / totalScenes) * 100) + '%';

  renderStep();
}

function renderStep() {
  textBox.innerHTML = '';
  choicesEl.innerHTML = '';
  continueBtn.style.display = 'none';

  if (!currentScene) return;

  // конец шагов
  if (currentStep >= currentScene.steps.length) {
    if (currentScene.isEnding) {
      showEnding();
      return;
    }
    if (currentScene.choices && currentScene.choices.length > 0) {
      showChoices();
      return;
    }
    showEnding();
    return;
  }

  const step = currentScene.steps[currentStep];
  currentStepData = step;

  // === КОНЦОВКА ===
  if (step.type === 'ending') {
    visualEl.style.backgroundImage = `url('${BG.ending}')`;
    portraitEl.classList.remove('show');
    textBox.innerHTML = `<div class="theory" style="border-left-color:#d4af6a;background:rgba(200,160,80,0.12);padding:20px;font-size:0.95rem;line-height:1.7;">${step.text}</div>`;
    currentStep++;
    continueBtn.textContent = 'Конец →';
    continueBtn.style.display = 'block';
    continueBtn.onclick = showEnding;
    return;
  }

  // === ФОН ===
  if (currentScene.visual) {
      visualEl.style.backgroundImage = `url('${currentScene.visual}')`;
  }

  // === ПОРТРЕТ ===
  if (step.type === 'line' && step.who) {
    const char = CHAR[step.who];
    if (char && char.img) {
        portraitEl.style.backgroundImage = `url('${char.img}')`;
        portraitEl.textContent = '';
        portraitEl.classList.add('show');
    } else {
        portraitEl.classList.remove('show');
    }
  } else {
      portraitEl.classList.remove('show');
  }

  // === ТЕКСТ ===
  let html = '';
  if (step.type === 'narr') {
    html = `<div class="narr">${step.text}</div>`;
  } else if (step.type === 'line') {
    const char = CHAR[step.who] || { name: step.who };
    html = `<div class="dialog-line"><span class="speaker ${step.who}">${char.name}:</span>${step.text}</div>`;
  } else if (step.type === 'theory') {
    html = `<div class="theory">${step.text}</div>`;
  }
  textBox.innerHTML = html;

  currentStep++;

  // === КНОПКА ДАЛЕЕ ===
  if (currentStep < currentScene.steps.length) {
    continueBtn.textContent = 'Далее →';
    continueBtn.style.display = 'block';
    continueBtn.onclick = renderStep;
  } else {
    if (currentScene.isEnding) {
      showEnding();
    } else if (currentScene.choices && currentScene.choices.length > 0) {
      showChoices();
    } else {
      showEnding();
    }
  }
}

function showChoices() {
  if (!currentScene || !currentScene.choices) {
    showEnding();
    return;
  }
  choicesEl.innerHTML = '';
  currentScene.choices.forEach((ch) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = '▸ ' + ch.text;
    btn.onclick = () => showScene(ch.next);
    choicesEl.appendChild(btn);
  });
  continueBtn.style.display = 'none';
}

function showEnding() {
  choicesEl.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'choice-btn';
  btn.textContent = '🔄 Пройти заново';
  btn.style.textAlign = 'center';
  btn.onclick = () => showScene(1);
  choicesEl.appendChild(btn);

  continueBtn.style.display = 'none';
  sceneLabel.textContent = 'Финал';
  progressBar.style.width = '100%';
  visualEl.style.backgroundImage = `url('${BG.restart}')`;
  portraitEl.classList.remove('show');
}

// ============ СТАРТ ============
showScene(1);
</script>
